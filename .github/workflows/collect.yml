name: collect-metrics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "只采集这个 Issue（可空，填了就覆盖重采）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 单元测试
        run: node --test

      - name: 采集
        env:
          TARGET_REPO: zwmhua2-lab2/MarketPulse-AI
          TARGET_TOKEN: ${{ secrets.TARGET_READ_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          OUT_DIR: data
        run: node scripts/collect.mjs

      - name: 提交
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "metrics: collect $(date -u +%F-%H)" && git push)
